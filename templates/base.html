{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ name }} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="{% static 'img/rozan.jpg' %}" />
    <link rel="stylesheet" href="{% static 'css/tailwind-output.css' %}" />
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />

    {% block meta %} {% endblock meta %}
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="{% url 'main:index' %}" class="brand">{{ name }}</a>
        <nav>
          <a href="{% url 'main:index' %}">Profile</a>
          <a href="{% url 'main:show_experience' %}">Experience</a>
          <a href="{% url 'main:show_awards' %}">Awards</a>
        </nav>
      </div>
    </header>

    <main>{% block content %} {% endblock content %}</main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 Rozan. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
      </div>
    </footer>
  </body>
</html>
