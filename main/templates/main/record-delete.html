{% extends 'base.html' %}
{% load static %}
{% block meta %}
<link rel="stylesheet" href="{% static 'css/main/awards.css' %}" />
<link rel="stylesheet" href="{% static 'css/main/records.css' %}" />
{% endblock %}
{% block content %}
<section class="awards">
  <div class="container">
    <h1>Delete {{ label }}?</h1>
    <p>Are you sure you want to delete <strong>{{ record }}</strong>?</p>
    <form method="post" class="record-actions">
      {% csrf_token %}
      <button type="submit" class="button button-danger">Delete {{ label }}</button>
      <a href="{% url list_view %}" class="button button-secondary">Cancel</a>
    </form>
  </div>
</section>
{% endblock %}
