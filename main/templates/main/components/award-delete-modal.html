<p class="experience-status">
  <button
    type="button"
    class="button button-danger"
    popovertarget="delete-award-{{ award.id }}"
    aria-label="Delete {{ award.title }}"
    title="Delete Award"
  >
    Delete
  </button>
</p>
<div
  id="delete-award-{{ award.id }}"
  class="award-delete-modal"
  popover="auto"
  role="dialog"
  aria-modal="true"
  aria-labelledby="delete-award-title-{{ award.id }}"
>
  <button
    type="button"
    class="award-delete-modal__backdrop"
    popovertarget="delete-award-{{ award.id }}"
    popovertargetaction="hide"
    aria-label="Tutup konfirmasi hapus"
  ></button>
  <div class="award-delete-modal__content">
    <button
      type="button"
      class="award-delete-modal__close"
      popovertarget="delete-award-{{ award.id }}"
      popovertargetaction="hide"
      aria-label="Tutup konfirmasi hapus"
    >
      ×
    </button>
    <h2 id="delete-award-title-{{ award.id }}">Delete Award?</h2>
    <p>
      Are you sure you want to delete
      <strong>{{ award.title }}</strong>?
    </p>
    <div class="award-delete-modal__actions">
      <button
        type="button"
        class="button button-secondary"
        popovertarget="delete-award-{{ award.id }}"
        popovertargetaction="hide"
      >
        Cancel
      </button>
      <form method="post" action="{% url 'main:delete_award' award.id %}">
        {% csrf_token %}
        <button type="submit" class="button button-danger">Yes, delete it</button>
      </form>
    </div>
  </div>
</div>
