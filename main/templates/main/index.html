{% extends 'base.html' %}

<!--  -->
{% load static %}

<!--  -->
{% block meta %}
<link rel="stylesheet" href="{% static 'css/main/index.css' %}" />
{% endblock meta %}

<!--  -->
{% block content %}
<section class="hero" id="profile">
  <div class="container hero-grid">
    <div class="hero-identity">
      <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
      <h1>{{ name }}</h1>
    </div>
    <div class="hero-photo">
      <div class="photo-block"></div>
      <img
        class="avatar"
        src="{% static 'img/rozan.jpg' %}"
        alt="Photo of Rozan"
      />
    </div>
    <div class="hero-details">
      <p class="bio">{{ bio }}</p>
      <dl class="meta-list">
        <div class="meta-row">
          <dt>NPM</dt>
          <dd>{{ npm }}</dd>
        </div>
        <div class="meta-row">
          <dt>Program</dt>
          <dd>{{ study_program }}</dd>
        </div>
      </dl>
      <div class="social-links">
        <a
          href="https://github.com/rozanlaudzai"
          class="social-link"
          target="_blank"
          >GitHub</a
        >
        <a
          href="https://linkedin.com/in/rozan-laudzai-2576b1336"
          class="social-link"
          target="_blank"
          >LinkedIn</a
        >
        <a
          href="mailto:rozanlaudzai717@gmail.com"
          class="social-link"
          target="_blank"
          >Email</a
        >
      </div>
    </div>
  </div>
</section>
{% endblock content %}
