{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ name }} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="{% static 'img/rozan.jpg' %}" />
    <link rel="stylesheet" href="{% static 'css/main/index.css' %}" />
    <link rel="stylesheet" href="{% static 'css/tailwind-output.css' %}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="{% url 'main:index' %}" class="brand">{{ name }}</a>
        <nav>
          <a href="{% url 'main:index' %}">Profile</a>
          <a href="{% url 'main:show_experience' %}">Experience</a>
          <a href="{% url 'main:show_awards' %}">Awards</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" id="profile">
        <div class="container hero-grid">
          <div class="hero-identity">
            <p class="hero-kicker">
              Computer Science &middot; Universitas Indonesia
            </p>
            <h1>{{ name }}</h1>
          </div>
          <div class="hero-photo">
            <div class="photo-block"></div>
            <img
              class="avatar"
              src="{% static 'img/rozan.jpg' %}"
              alt="Photo of Rozan"
            />
          </div>
          <div class="hero-details">
            <p class="bio">{{ bio }}</p>
            <dl class="meta-list">
              <div class="meta-row">
                <dt>NPM</dt>
                <dd>{{ npm }}</dd>
              </div>
              <div class="meta-row">
                <dt>Program</dt>
                <dd>{{ study_program }}</dd>
              </div>
            </dl>
            <div class="social-links">
              <a
                href="https://github.com/rozanlaudzai"
                class="social-link"
                target="_blank"
                >GitHub</a
              >
              <a
                href="https://linkedin.com/in/rozan-laudzai-2576b1336"
                class="social-link"
                target="_blank"
                >LinkedIn</a
              >
              <a
                href="mailto:rozanlaudzai717@gmail.com"
                class="social-link"
                target="_blank"
                >Email</a
              >
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 Rozan. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
      </div>
    </footer>
  </body>
</html>
