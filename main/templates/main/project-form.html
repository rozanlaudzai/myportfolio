{% extends 'base.html' %}

<!--  -->
{% load static %}

<!--  -->
{% block meta %}
<link rel="stylesheet" href="{% static 'css/main/projects.css' %}" />
<link rel="stylesheet" href="{% static 'css/main/experience.css' %}" />
{% endblock meta %}

<!--  -->
{% block content %}
<section class="experience-section">
  <div class="container">
    <h1>Add New Projects</h1>
    <form
      method="post"
      action="{% url 'main:create_project' %}"
      class="project-form"
    >
      {% csrf_token %}

      <!--  -->
      {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>

        {{ field }}

        <!--  -->
        {% for error in field.errors %}
        <p class="form-error">{{ error }}</p>
        {% endfor %}
      </div>
      {% endfor %}

      <button type="submit" class="button">Add Project</button>

      <a href="{% url 'main:show_projects' %}" class="button button-secondary">
        Cancel
      </a>
    </form>
  </div>
</section>
{% endblock content %}
